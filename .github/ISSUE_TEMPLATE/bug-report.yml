name: "🐞 Bug Report"
description: "버그나 예외 상황을 리포트합니다."
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 버그 리포트
        발생한 문제 상황을 상세히 기술해 주세요.
  - type: input
    id: link
    attributes:
      label: "관련 링크"
      description: "Linear 이슈, Sentry 로그, 혹은 관련 슬랙 스레드 링크가 있다면 첨부해 주세요."
      placeholder: "https://linear.app/..."
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      description: "어떤 상황에서 버그가 발생했는지, 증상은 무엇인지 설명해 주세요."
      placeholder: "로그인 화면에서 '확인' 버튼을 눌렀으나 아무런 반응이 없습니다."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "재현 경로"
      description: "버그를 재현하기 위한 단계를 순서대로 작성해 주세요."
      placeholder: |
        1. 메인 페이지 접속
        2. 상단 네비게이션 바의 '설정' 클릭
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "예상 동작"
      description: "정상적으로 동작했다면 어떤 결과가 나와야 하는지 작성해 주세요."
      placeholder: "설정 모달 창이 화면 중앙에 표시되어야 합니다."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "환경 정보"
      description: "버그가 발생한 환경을 기재해 주세요."
      placeholder: |
        - OS: macOS 14.0
        - Browser: Chrome 120.0
        - Version: v1.2.0
      render: markdown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: "로그 및 스크린샷"
      description: "에러 로그나 스크린샷이 있다면 첨부해 주세요."
      render: shell
    validations:
      required: false
