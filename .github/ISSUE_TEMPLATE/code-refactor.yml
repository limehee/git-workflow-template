name: "🔨 Code Refactor"
description: "기존 코드의 구조를 개선하거나 기술 부채를 해결합니다."
labels: ["type: refactor"]
body:
  - type: markdown
    attributes:
      value: |
        ### 리팩토링 요청
        기능의 변경 없이 코드 구조를 개선하기 위한 작업입니다.
  - type: input
    id: link
    attributes:
      label: "관련 링크"
      description: "관련된 이슈나 참고 자료가 있다면 링크를 남겨주세요."
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: "개선 필요 설명"
      description: "현재 코드의 문제점이나 개선이 필요한 이유를 설명해 주세요."
      placeholder: "UserService 클래스가 2000줄을 넘어가며, 인증 로직과 비즈니스 로직이 강하게 결합되어 있어 테스트가 어렵습니다."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "개선 목표 및 방안"
      description: "어떻게 개선할 것인지 구체적인 계획을 작성해 주세요."
      placeholder: |
        1. 인증 로직을 AuthService로 분리
        2. UserValidator 클래스 생성하여 유효성 검사 로직 위임
        3. 관련 단위 테스트 작성
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: "기대 효과"
      description: "이 리팩토링을 통해 얻을 수 있는 이점을 작성해 주세요."
      placeholder: "UserService의 코드 복잡도가 50% 감소하고, 단위 테스트 커버리지를 80%까지 올릴 수 있습니다."
    validations:
      required: false
