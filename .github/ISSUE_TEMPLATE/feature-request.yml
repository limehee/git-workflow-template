name: "✨ Feature Request"
description: "새로운 기능을 제안하거나 추가합니다."
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### 신규 기능 제안
        새로운 기능 개발을 위한 명세를 작성합니다.
  - type: input
    id: link
    attributes:
      label: "기획/디자인 링크"
      description: "Figma, Linear, Notion 등 기획 문서를 첨부해 주세요."
      placeholder: "https://www.figma.com/file/..."
    validations:
      required: false
  - type: textarea
    id: background
    attributes:
      label: "배경 및 목적"
      description: "이 기능이 왜 필요한지, 무엇을 해결하고자 하는지 설명해 주세요."
      placeholder: "사용자가 주문 내역을 엑셀로 다운로드하여 정산 업무를 효율화하기 위함입니다."
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: "구체적 작업 항목"
      description: "구현해야 할 세부 작업 목록을 체크리스트 형태로 작성해 주세요."
      placeholder: |
        - [ ] 엑셀 다운로드 버튼 UI 추가
        - [ ] 주문 목록 조회 API에 엑셀 Export 옵션 추가
        - [ ] Apache POI 라이브러리 연동
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: "인수 조건"
      description: "기능이 완료되었다고 판단할 수 있는 기준을 작성해 주세요."
      placeholder: |
        - [ ] 다운로드 버튼 클릭 시 .xlsx 파일이 다운로드 되어야 함
        - [ ] 파일 내 데이터가 DB의 최신 주문 내역과 일치해야 함
    validations:
      required: false
